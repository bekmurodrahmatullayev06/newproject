name: Publish Kosmik Qochish

on:
  push:
    branches:
      - main
    paths:
      - "Qaytish/**"
      - ".github/workflows/publish-kosmik-qochish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: Qaytish
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
