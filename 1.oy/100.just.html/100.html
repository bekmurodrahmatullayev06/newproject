<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Najot Ta'lim Uslubidagi Logotip</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d1117;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Emblem Container */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 25px 40px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    /* Icon Styling */
    .logo-icon {
      position: relative;
      width: 70px;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Outer glowing ring */
    .logo-icon::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(#f37021, #00a859, #f37021);
      animation: rotate 6s linear infinite;
      opacity: 0.8;
      filter: blur(8px);
    }

    /* Inner circle base */
    .icon-inner {
      position: relative;
      width: 66px;
      height: 66px;
      background-color: #121824;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    /* Modern 'N' shape representation */
    .symbol {
      width: 32px;
      height: 36px;
      position: relative;
    }

    .symbol::before,
    .symbol::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 100%;
      border-radius: 5px;
    }

    /* Left orange bar */
    .symbol::before {
      left: 0;
      background: linear-gradient(180deg, #f37021 0%, #ff944d 100%);
    }

    /* Right green bar */
    .symbol::after {
      right: 0;
      background: linear-gradient(180deg, #00a859 0%, #22c55e 100%);
    }

    /* Diagonal connecting element */
    .symbol-middle {
      position: absolute;
      top: 18px;
      left: 16px;
      width: 12px;
      height: 12px;
      background: linear-gradient(135deg, #f37021, #00a859);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(243, 112, 33, 0.5);
    }

    /* Typography */
    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-name span {
      color: #f37021;
    }

    .brand-subtext {
      font-size: 13px;
      font-weight: 600;
      color: #00a859;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    @keyframes rotate {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <div class="logo-icon">
      <div class="icon-inner">
        <div class="symbol">
          <div class="symbol-middle"></div>
        </div>
      </div>
    </div>
    <div class="brand-text">
      <div class="brand-name">NAJOT <span>TA'LIM</span></div>
      <div class="brand-subtext">Zamonaviy Kasblar Markazi</div>
    </div>
  </div>

</body>
</html>
