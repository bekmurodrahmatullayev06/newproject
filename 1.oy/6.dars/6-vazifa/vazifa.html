<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Profil Karta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="vazifa.css">
</head>
<body>

  <!-- Asosiy karta container -->
  <div class="card">

    <!-- 1-item: Rasm -->
    <div class="item">
      <img src="https://i.pravatar.cc/150?img=12" class="profile-img">
    </div>

    <!-- 2-item: Ism va Kasb -->
    <div class="item">
      <h2>John Doe</h2>
      <p class="job">Web Developer</p>
    </div>

    <!-- 3-item: Bio (Matn) -->
    <div class="item">
      <p class="text">
        Passionate about creating beautiful and functional websites. Always learning and exploring new technologies.
      </p>
    </div>

    <!-- 4-item: Ikonkalar (Socials) -->
    <div class="icons">
      <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#"><i class="fa-brands fa-twitter"></i></a>
      <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
      <a href="#"><i class="fa-brands fa-github"></i></a>
    </div>

    <!-- 5-item: Tugma -->
    <div class="item">
      <button class="btn">Connect</button>
    </div>

  </div>

</body>
</html>
