services:
  - type: web
    name: future-step-center
    runtime: node
    plan: starter
    rootDir: ish/tajriba/vite-project
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/setup/status
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: FUTURE_STEP_RENDER_PROXY
        value: "true"
      - key: PUBLIC_SITE_URL
        value: https://future-step-center.onrender.com
      - key: FUTURE_STEP_SETUP_KEY
        generateValue: true
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: UV_THREADPOOL_SIZE
        value: "8"
      - key: DATABASE_URL
        fromDatabase:
          name: future-step-db
          property: connectionString

databases:
  - name: future-step-db
    plan: basic-256mb
    databaseName: future_step
    user: future_step
